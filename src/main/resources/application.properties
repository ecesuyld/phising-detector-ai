spring.application.name=phisingproject

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jdbc.fetch-size=1000


spring.kafka.bootstrap-servers=${KAFKA_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=${KAFKA_TYPE_MAPPING}

access-check.scheduler.fixed-rate=3600000
access-check.scheduler.enabled=true
access-check.connection-timeout=5000
access-check.read-timeout=5000

access-check.kafka.topic=${KAFKA_TOPIC}
